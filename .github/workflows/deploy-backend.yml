name: Deploy Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_ADDRESS: ${{ secrets.SERVER_ADDRESS }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MAIL_HOST: ${{ secrets.MAIL_HOST }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      PUBLIC_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      DEFAULT_RATE_PER_KWH: ${{ secrets.DEFAULT_RATE_PER_KWH }}
      CHARGING_EFFICIENCY_FACTOR: ${{ secrets.CHARGING_EFFICIENCY_FACTOR }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
      WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
      GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_CURRENCY: ${{ secrets.RAZORPAY_CURRENCY }}
      RAZORPAY_BUSINESS_NAME: ${{ secrets.RAZORPAY_BUSINESS_NAME }}
      RAZORPAY_MINIMUM_AMOUNT: ${{ secrets.RAZORPAY_MINIMUM_AMOUNT }}

    defaults:
      run:
        shell: bash
        working-directory: plugin-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate backend deployment secrets
        run: |
          missing=0
          for name in EC2_SSH_KEY EC2_HOST EC2_USER EC2_APP_DIR MONGODB_URI JWT_SECRET MAIL_PASSWORD APP_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in GitHub repository secrets"
              missing=1
            fi
          done
          for name in RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is empty; Razorpay wallet/payment features may not work"
            fi
          done
          exit $missing

      - name: Apply backend deployment defaults
        run: |
          SERVER_PORT="${SERVER_PORT:-8081}"
          SERVER_ADDRESS="${SERVER_ADDRESS:-0.0.0.0}"
          MONGODB_DATABASE="${MONGODB_DATABASE:-plugindb}"
          MAIL_HOST="${MAIL_HOST:-smtp.gmail.com}"
          MAIL_PORT="${MAIL_PORT:-587}"
          MAIL_USERNAME="${MAIL_USERNAME:-plugin.available@gmail.com}"
          MAIL_FROM="${MAIL_FROM:-$MAIL_USERNAME}"
          PUBLIC_API_BASE_URL="${PUBLIC_API_BASE_URL:-http://plugin-backend-alb-520575954.ap-south-1.elb.amazonaws.com/api}"
          DEFAULT_RATE_PER_KWH="${DEFAULT_RATE_PER_KWH:-15}"
          CHARGING_EFFICIENCY_FACTOR="${CHARGING_EFFICIENCY_FACTOR:-0.92}"
          SUPPORT_EMAIL="${SUPPORT_EMAIL:-plugin.onservice@gmail.com}"
          WEBSITE_URL="${WEBSITE_URL:-www.plugin.com}"
          GOOGLE_CLIENT_IDS="${GOOGLE_CLIENT_IDS:-380196336293-ghfo78fd82va3gp0dffren6lk2mqcrg1.apps.googleusercontent.com,380196336293-5i90qr9kni2p8b2oahpukrlgs081lj99.apps.googleusercontent.com}"
          RAZORPAY_CURRENCY="${RAZORPAY_CURRENCY:-INR}"
          RAZORPAY_BUSINESS_NAME="${RAZORPAY_BUSINESS_NAME:-PLUGIN}"
          RAZORPAY_MINIMUM_AMOUNT="${RAZORPAY_MINIMUM_AMOUNT:-1.00}"
          {
            printf 'SERVER_PORT=%s\n' "$SERVER_PORT"
            printf 'SERVER_ADDRESS=%s\n' "$SERVER_ADDRESS"
            printf 'MONGODB_DATABASE=%s\n' "$MONGODB_DATABASE"
            printf 'MAIL_HOST=%s\n' "$MAIL_HOST"
            printf 'MAIL_PORT=%s\n' "$MAIL_PORT"
            printf 'MAIL_USERNAME=%s\n' "$MAIL_USERNAME"
            printf 'MAIL_FROM=%s\n' "$MAIL_FROM"
            printf 'PUBLIC_API_BASE_URL=%s\n' "$PUBLIC_API_BASE_URL"
            printf 'DEFAULT_RATE_PER_KWH=%s\n' "$DEFAULT_RATE_PER_KWH"
            printf 'CHARGING_EFFICIENCY_FACTOR=%s\n' "$CHARGING_EFFICIENCY_FACTOR"
            printf 'SUPPORT_EMAIL=%s\n' "$SUPPORT_EMAIL"
            printf 'WEBSITE_URL=%s\n' "$WEBSITE_URL"
            printf 'GOOGLE_CLIENT_IDS=%s\n' "$GOOGLE_CLIENT_IDS"
            printf 'RAZORPAY_CURRENCY=%s\n' "$RAZORPAY_CURRENCY"
            printf 'RAZORPAY_BUSINESS_NAME=%s\n' "$RAZORPAY_BUSINESS_NAME"
            printf 'RAZORPAY_MINIMUM_AMOUNT=%s\n' "$RAZORPAY_MINIMUM_AMOUNT"
          } >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot JAR
        run: mvn clean package -DskipTests

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          EC2_SSH_HOSTS=""
          for raw_host in $(printf '%s' "$EC2_HOST" | tr ',' ' '); do
            host="${raw_host#http://}"
            host="${host#https://}"
            host="${host%%/*}"
            if [ -n "$host" ]; then
              EC2_SSH_HOSTS="$EC2_SSH_HOSTS $host"
            fi
          done
          if [ -z "$EC2_SSH_HOSTS" ]; then
            echo "::error::EC2_HOST is empty or invalid"
            exit 1
          fi
          echo "EC2_SSH_HOSTS=$EC2_SSH_HOSTS" >> "$GITHUB_ENV"
          for EC2_SSH_HOST in $EC2_SSH_HOSTS; do
            ssh-keyscan -T 20 -H "$EC2_SSH_HOST" >> ~/.ssh/known_hosts || true
          done

      - name: Prepare EC2 app directory
        run: |
          for EC2_SSH_HOST in $EC2_SSH_HOSTS; do
            ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$EC2_USER@$EC2_SSH_HOST" \
              "sudo mkdir -p '$EC2_APP_DIR' && sudo chown -R '$EC2_USER:$EC2_USER' '$EC2_APP_DIR'"
          done

      - name: Upload JAR to EC2
        run: |
          for EC2_SSH_HOST in $EC2_SSH_HOSTS; do
            scp -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 target/*.jar "$EC2_USER@$EC2_SSH_HOST:$EC2_APP_DIR/plugin.jar"
          done

      - name: Upload backend runtime environment to EC2
        run: |
          {
            printf 'SERVER_PORT=%s\n' "$SERVER_PORT"
            printf 'SERVER_ADDRESS=%s\n' "$SERVER_ADDRESS"
            printf 'MONGODB_URI=%s\n' "$MONGODB_URI"
            printf 'MONGODB_DATABASE=%s\n' "$MONGODB_DATABASE"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'MAIL_HOST=%s\n' "$MAIL_HOST"
            printf 'MAIL_PORT=%s\n' "$MAIL_PORT"
            printf 'MAIL_USERNAME=%s\n' "$MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%s\n' "$MAIL_PASSWORD"
            printf 'MAIL_FROM=%s\n' "$MAIL_FROM"
            printf 'APP_BASE_URL=%s\n' "$APP_BASE_URL"
            printf 'DEFAULT_RATE_PER_KWH=%s\n' "$DEFAULT_RATE_PER_KWH"
            printf 'CHARGING_EFFICIENCY_FACTOR=%s\n' "$CHARGING_EFFICIENCY_FACTOR"
            printf 'SUPPORT_EMAIL=%s\n' "$SUPPORT_EMAIL"
            printf 'WEBSITE_URL=%s\n' "$WEBSITE_URL"
            printf 'GOOGLE_CLIENT_IDS=%s\n' "$GOOGLE_CLIENT_IDS"
            printf 'RAZORPAY_KEY_ID=%s\n' "$RAZORPAY_KEY_ID"
            printf 'RAZORPAY_KEY_SECRET=%s\n' "$RAZORPAY_KEY_SECRET"
            printf 'RAZORPAY_CURRENCY=%s\n' "$RAZORPAY_CURRENCY"
            printf 'RAZORPAY_BUSINESS_NAME=%s\n' "$RAZORPAY_BUSINESS_NAME"
            printf 'RAZORPAY_MINIMUM_AMOUNT=%s\n' "$RAZORPAY_MINIMUM_AMOUNT"
          } > plugin-backend.env
          for EC2_SSH_HOST in $EC2_SSH_HOSTS; do
            scp -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 plugin-backend.env "$EC2_USER@$EC2_SSH_HOST:/tmp/plugin-backend.env"
            ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$EC2_USER@$EC2_SSH_HOST" << 'EOF'
              sudo mkdir -p /etc/plugin
              sudo mv /tmp/plugin-backend.env /etc/plugin/plugin-backend.env
              sudo chown root:root /etc/plugin/plugin-backend.env
              sudo chmod 600 /etc/plugin/plugin-backend.env
              sudo systemctl daemon-reload
          EOF
          done

      - name: Install Spring Boot systemd service
        run: |
          for EC2_SSH_HOST in $EC2_SSH_HOSTS; do
            ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$EC2_USER@$EC2_SSH_HOST" \
              "sudo tee /etc/systemd/system/plugin-backend.service > /dev/null" << EOF
          [Unit]
          Description=Plugin Backend Spring Boot App
          After=network.target

          [Service]
          User=$EC2_USER
          WorkingDirectory=$EC2_APP_DIR
          ExecStart=/usr/bin/java -jar $EC2_APP_DIR/plugin.jar
          Restart=always
          RestartSec=5
          EnvironmentFile=/etc/plugin/plugin-backend.env
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target
          EOF
            ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$EC2_USER@$EC2_SSH_HOST" \
              "sudo systemctl daemon-reload && sudo systemctl enable plugin-backend"
          done

      - name: Restart Spring Boot Service
        run: |
          for EC2_SSH_HOST in $EC2_SSH_HOSTS; do
            ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$EC2_USER@$EC2_SSH_HOST" "SERVER_PORT='$SERVER_PORT' bash -s" << 'EOF'
              sudo systemctl stop plugin-backend || true
              pids=$(sudo ss -ltnp "sport = :$SERVER_PORT" | sed -n 's/.*pid=\([0-9]\+\).*/\1/p' | sort -u)
              if [ -n "$pids" ]; then
                sudo kill $pids || true
                sleep 2
              fi
              sudo systemctl restart plugin-backend
              sudo systemctl status plugin-backend --no-pager
          EOF
          done

      - name: Verify public Google auth route
        run: |
          response_file="$(mktemp)"
          status=$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$PUBLIC_API_BASE_URL/auth/google" \
            -H "Content-Type: application/json" \
            --data '{"accessToken":"invalid-deploy-smoke-token"}' || true)
          body="$(cat "$response_file")"
          echo "Google auth smoke status: $status"
          if printf '%s' "$body" | grep -q "No static resource"; then
            echo "::error::Public backend is still serving an old app without /api/auth/google"
            exit 1
          fi
