name: Build and deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'plugin-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: plugin-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Test and package Spring Boot application
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload tested JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-${{ github.sha }}
          path: plugin-backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: plugin-backend
    steps:
      - name: Download tested JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-${{ github.sha }}
          path: plugin-backend/artifact

      - name: Validate deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '8091' }}
          PUBLIC_API_HEALTHCHECK_URL: ${{ vars.PUBLIC_API_HEALTHCHECK_URL }}
        run: |
          set -Eeuo pipefail
          for name in EC2_HOST EC2_USER EC2_APP_DIR EC2_SSH_KEY EC2_KNOWN_HOSTS PUBLIC_API_HEALTHCHECK_URL; do
            test -n "${!name}" || { echo "::error::$name is required"; exit 1; }
          done
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo '::error::EC2_HOST must be one hostname or IPv4 address without a URL scheme'; exit 1; }
          [[ "$EC2_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo '::error::EC2_USER is invalid'; exit 1; }
          [[ "$EC2_APP_DIR" =~ ^/(opt|srv)/[A-Za-z0-9._/-]+$ ]] || { echo '::error::EC2_APP_DIR must be a specific path below /opt or /srv'; exit 1; }
          [[ "$EC2_SSH_PORT" =~ ^[0-9]{1,5}$ && "$SERVER_PORT" =~ ^[0-9]{1,5}$ ]] || { echo '::error::SSH and server ports must be numeric'; exit 1; }
          case "$PUBLIC_API_HEALTHCHECK_URL" in
            https://*) ;;
            *) echo '::error::PUBLIC_API_HEALTHCHECK_URL must use HTTPS'; exit 1 ;;
          esac

      - name: Configure strict SSH host verification
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/plugin-ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/plugin-ssh/deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$RUNNER_TEMP/plugin-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/plugin-ssh/deploy_key" "$RUNNER_TEMP/plugin-ssh/known_hosts"
          lookup="$EC2_HOST"
          if [ "$EC2_SSH_PORT" != '22' ]; then lookup="[$EC2_HOST]:$EC2_SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f "$RUNNER_TEMP/plugin-ssh/known_hosts" >/dev/null || {
            echo '::error::EC2_KNOWN_HOSTS does not contain the configured host and port'
            exit 1
          }

      - name: Upload versioned JAR and atomically activate it
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '8091' }}
        run: |
          set -Eeuo pipefail
          jar_path="$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$jar_path" || { echo '::error::Downloaded JAR is missing'; exit 1; }
          expected_sha="$(sha256sum "$jar_path" | awk '{print $1}')"
          ssh_options=(-i "$RUNNER_TEMP/plugin-ssh/deploy_key" -p "$EC2_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/plugin-ssh/known_hosts" -o ConnectTimeout=30)
          remote_upload="/tmp/plugin-${GITHUB_SHA}.jar.upload"
          scp -i "$RUNNER_TEMP/plugin-ssh/deploy_key" -P "$EC2_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/plugin-ssh/known_hosts" -o ConnectTimeout=30 \
            "$jar_path" "$EC2_USER@$EC2_HOST:$remote_upload"

          ssh "${ssh_options[@]}" "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$EC2_APP_DIR' '$expected_sha' '$SERVER_PORT' '$GITHUB_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          app_dir="$1"
          expected_sha="$2"
          server_port="$3"
          release_id="$4"
          upload="/tmp/plugin-${release_id}.jar.upload"
          release_dir="$app_dir/releases"
          release_jar="$release_dir/plugin-${release_id}.jar"
          previous=''
          trap 'rm -f -- "$upload"' EXIT

          actual_sha="$(sha256sum "$upload" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha" || { echo 'Uploaded JAR checksum mismatch' >&2; exit 1; }
          sudo test -f /etc/plugin/plugin-backend.env || { echo 'Provision /etc/plugin/plugin-backend.env before deployment' >&2; exit 1; }
          test "$(sudo stat -c '%a' /etc/plugin/plugin-backend.env)" = '600' || { echo 'Runtime environment file must be root-owned mode 600' >&2; exit 1; }
          test "$(sudo stat -c '%U:%G' /etc/plugin/plugin-backend.env)" = 'root:root' || { echo 'Runtime environment file must be owned by root:root' >&2; exit 1; }

          if ! id -u plugin >/dev/null 2>&1; then
            sudo useradd --system --home-dir /nonexistent --shell /usr/sbin/nologin plugin
          fi
          sudo install -d -o root -g root -m 0755 "$app_dir" "$release_dir"
          if sudo test -e "$app_dir/plugin.jar"; then
            if sudo test -L "$app_dir/plugin.jar"; then
              previous="$(sudo readlink -f "$app_dir/plugin.jar")"
            else
              previous="$release_dir/plugin-before-${release_id}.jar"
              sudo install -o root -g root -m 0444 "$app_dir/plugin.jar" "$previous"
            fi
          fi
          sudo install -o root -g root -m 0444 "$upload" "$release_jar"

          sudo tee /etc/systemd/system/plugin-backend.service >/dev/null <<UNIT
          [Unit]
          Description=Plugin Backend Spring Boot App
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=plugin
          WorkingDirectory=$app_dir
          EnvironmentFile=/etc/plugin/plugin-backend.env
          ExecStart=/usr/bin/java -Duser.timezone=Asia/Kolkata -jar $app_dir/plugin.jar
          Restart=on-failure
          RestartSec=5
          SuccessExitStatus=143
          UMask=0077
          NoNewPrivileges=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectSystem=strict
          ProtectHome=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          ProtectClock=true
          RestrictSUIDSGID=true
          RestrictNamespaces=true
          RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
          LockPersonality=true
          CapabilityBoundingSet=
          AmbientCapabilities=

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo ln -sfn "releases/plugin-${release_id}.jar" "$app_dir/plugin.jar.next"
          sudo mv -Tf "$app_dir/plugin.jar.next" "$app_dir/plugin.jar"
          sudo systemctl daemon-reload
          sudo systemctl enable plugin-backend >/dev/null
          sudo systemctl restart plugin-backend

          healthy=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${server_port}/api/stations?size=1" >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo 'New backend release failed its local readiness check; rolling back' >&2
            if [ -n "$previous" ] && sudo test -f "$previous"; then
              case "$previous" in
                "$release_dir"/*)
                  sudo ln -sfn "$previous" "$app_dir/plugin.jar.next"
                  sudo mv -Tf "$app_dir/plugin.jar.next" "$app_dir/plugin.jar"
                  sudo systemctl restart plugin-backend
                  ;;
              esac
            fi
            exit 1
          fi
          REMOTE

      - name: Fail deployment if the public API is unhealthy
        env:
          PUBLIC_API_HEALTHCHECK_URL: ${{ vars.PUBLIC_API_HEALTHCHECK_URL }}
        run: curl --fail --silent --show-error --location --retry 5 --retry-all-errors --max-time 20 "$PUBLIC_API_HEALTHCHECK_URL" --output /dev/null
