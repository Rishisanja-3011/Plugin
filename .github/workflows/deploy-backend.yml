name: Deploy Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      # Fill these in GitHub repository secrets:
      # EC2_SSH_KEY=
      # EC2_HOST=
      # EC2_USER=
      # EC2_APP_DIR=
      # MONGODB_URI=
      # MONGODB_DATABASE=plugindb
      # JWT_SECRET=
      # MAIL_USERNAME=plugin.available@gmail.com
      # MAIL_PASSWORD=
      # MAIL_FROM=plugin.available@gmail.com
      # APP_BASE_URL=
      # GOOGLE_CLIENT_IDS=
      # RAZORPAY_KEY_ID=
      # RAZORPAY_KEY_SECRET=
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '8091' }}
      SERVER_ADDRESS: ${{ secrets.SERVER_ADDRESS || '0.0.0.0' }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE || 'plugindb' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MAIL_HOST: ${{ secrets.MAIL_HOST || 'smtp.gmail.com' }}
      MAIL_PORT: ${{ secrets.MAIL_PORT || '587' }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME || 'plugin.available@gmail.com' }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM || 'plugin.available@gmail.com' }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      DEFAULT_RATE_PER_KWH: ${{ secrets.DEFAULT_RATE_PER_KWH || '15' }}
      CHARGING_EFFICIENCY_FACTOR: ${{ secrets.CHARGING_EFFICIENCY_FACTOR || '0.92' }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL || 'plugin.onservice@gmail.com' }}
      WEBSITE_URL: ${{ secrets.WEBSITE_URL || 'www.plugin.com' }}
      GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS || '380196336293-ghfo78fd82va3gp0dffren6lk2mqcrg1.apps.googleusercontent.com,380196336293-5i90qr9kni2p8b2oahpukrlgs081lj99.apps.googleusercontent.com' }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_CURRENCY: ${{ secrets.RAZORPAY_CURRENCY || 'INR' }}
      RAZORPAY_BUSINESS_NAME: ${{ secrets.RAZORPAY_BUSINESS_NAME || 'PLUGIN' }}
      RAZORPAY_MINIMUM_AMOUNT: ${{ secrets.RAZORPAY_MINIMUM_AMOUNT || '1.00' }}

    defaults:
      run:
        working-directory: plugin-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate backend deployment secrets
        run: |
          missing=0
          for name in EC2_SSH_KEY EC2_HOST EC2_USER EC2_APP_DIR MONGODB_URI JWT_SECRET MAIL_PASSWORD APP_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in GitHub repository secrets"
              missing=1
            fi
          done
          for name in RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is empty; Razorpay wallet/payment features may not work"
            fi
          done
          exit $missing

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot JAR
        run: mvn clean package -DskipTests

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload JAR to EC2
        run: |
          scp -i ~/.ssh/ec2_key target/*.jar "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/plugin.jar"

      - name: Upload backend runtime environment to EC2
        run: |
          {
            printf 'SERVER_PORT=%s\n' "$SERVER_PORT"
            printf 'SERVER_ADDRESS=%s\n' "$SERVER_ADDRESS"
            printf 'MONGODB_URI=%s\n' "$MONGODB_URI"
            printf 'MONGODB_DATABASE=%s\n' "$MONGODB_DATABASE"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'MAIL_HOST=%s\n' "$MAIL_HOST"
            printf 'MAIL_PORT=%s\n' "$MAIL_PORT"
            printf 'MAIL_USERNAME=%s\n' "$MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%s\n' "$MAIL_PASSWORD"
            printf 'MAIL_FROM=%s\n' "$MAIL_FROM"
            printf 'APP_BASE_URL=%s\n' "$APP_BASE_URL"
            printf 'DEFAULT_RATE_PER_KWH=%s\n' "$DEFAULT_RATE_PER_KWH"
            printf 'CHARGING_EFFICIENCY_FACTOR=%s\n' "$CHARGING_EFFICIENCY_FACTOR"
            printf 'SUPPORT_EMAIL=%s\n' "$SUPPORT_EMAIL"
            printf 'WEBSITE_URL=%s\n' "$WEBSITE_URL"
            printf 'GOOGLE_CLIENT_IDS=%s\n' "$GOOGLE_CLIENT_IDS"
            printf 'RAZORPAY_KEY_ID=%s\n' "$RAZORPAY_KEY_ID"
            printf 'RAZORPAY_KEY_SECRET=%s\n' "$RAZORPAY_KEY_SECRET"
            printf 'RAZORPAY_CURRENCY=%s\n' "$RAZORPAY_CURRENCY"
            printf 'RAZORPAY_BUSINESS_NAME=%s\n' "$RAZORPAY_BUSINESS_NAME"
            printf 'RAZORPAY_MINIMUM_AMOUNT=%s\n' "$RAZORPAY_MINIMUM_AMOUNT"
          } > plugin-backend.env
          scp -i ~/.ssh/ec2_key plugin-backend.env "$EC2_USER@$EC2_HOST:/tmp/plugin-backend.env"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" << 'EOF'
            sudo mkdir -p /etc/plugin
            sudo mv /tmp/plugin-backend.env /etc/plugin/plugin-backend.env
            sudo chown root:root /etc/plugin/plugin-backend.env
            sudo chmod 600 /etc/plugin/plugin-backend.env
            sudo mkdir -p /etc/systemd/system/plugin-backend.service.d
            sudo sh -c 'printf "%s\n" "[Service]" "EnvironmentFile=/etc/plugin/plugin-backend.env" > /etc/systemd/system/plugin-backend.service.d/env.conf'
            sudo systemctl daemon-reload
          EOF

      - name: Restart Spring Boot Service
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" << 'EOF'
            sudo systemctl restart plugin-backend
            sudo systemctl status plugin-backend --no-pager
          EOF
