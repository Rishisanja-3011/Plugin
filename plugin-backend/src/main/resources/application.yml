server:
  port: "${SERVER_PORT:8091}"
  address: "${SERVER_ADDRESS:0.0.0.0}"

spring:
  config:
    import:
      - "optional:file:./application-local.yml"
      - "optional:file:./plugin-backend/application-local.yml"
  data:
    mongodb:
      uri: "${MONGODB_URI:mongodb://localhost:27017/plugindb}"
      database: "${MONGODB_DATABASE:plugindb}"
      auto-index-creation: false

  mail:
    host: "${MAIL_HOST:smtp.gmail.com}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:plugin.available@gmail.com}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            trust: "${MAIL_HOST:smtp.gmail.com}"

app:
  mail:
    from: "${MAIL_FROM:${MAIL_USERNAME:plugin.available@gmail.com}}"
  confirm:
    base-url: "${APP_BASE_URL:http://localhost:8091}"
  billing:
    default-rate-per-kwh: "${DEFAULT_RATE_PER_KWH:15}"
    efficiency-factor: "${CHARGING_EFFICIENCY_FACTOR:0.92}"
  support:
    email: "${SUPPORT_EMAIL:plugin.onservice@gmail.com}"
  website:
    url: "${WEBSITE_URL:www.plugin.com}"
  notifications:
    booking-start-initial-delay-ms: "${BOOKING_START_NOTIFICATION_INITIAL_DELAY_MS:10000}"
    booking-start-check-ms: "${BOOKING_START_NOTIFICATION_CHECK_MS:30000}"
    booking-start-lookback-minutes: "${BOOKING_START_NOTIFICATION_LOOKBACK_MINUTES:180}"
  google:
    client-ids: "${GOOGLE_CLIENT_IDS:380196336293-ghfo78fd82va3gp0dffren6lk2mqcrg1.apps.googleusercontent.com,380196336293-5i90qr9kni2p8b2oahpukrlgs081lj99.apps.googleusercontent.com}"
  razorpay:
    key-id: "${RAZORPAY_KEY_ID:}"
    key-secret: "${RAZORPAY_KEY_SECRET:}"
    currency: "${RAZORPAY_CURRENCY:INR}"
    business-name: "${RAZORPAY_BUSINESS_NAME:PLUGIN}"
    minimum-amount: "${RAZORPAY_MINIMUM_AMOUNT:1.00}"
  wallet:
    monitor-initial-delay-ms: "${WALLET_MONITOR_INITIAL_DELAY_MS:2000}"
    monitor-check-ms: "${WALLET_MONITOR_CHECK_MS:3000}"
  bookings:
    expiry-initial-delay-ms: "${BOOKING_EXPIRY_INITIAL_DELAY_MS:15000}"
    expiry-check-ms: "${BOOKING_EXPIRY_CHECK_MS:30000}"
  sessions:
    auto-complete-initial-delay-ms: "${SESSION_AUTO_COMPLETE_INITIAL_DELAY_MS:1000}"
    auto-complete-check-ms: "${SESSION_AUTO_COMPLETE_CHECK_MS:1000}"
  jwt:
    secret: "${JWT_SECRET:devOnlyJwtSecretKeyForLocalDevelopmentMustBeAtLeast256BitsLong}"
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

logging:
  level:
    com.plugin: INFO
    org.springframework.security: INFO
