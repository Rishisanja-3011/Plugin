server:
  port: "${SERVER_PORT:8091}"
  address: "${SERVER_ADDRESS:0.0.0.0}"
  forward-headers-strategy: none

spring:
  config:
    import:
      - "optional:file:./application-local.yml"
      - "optional:file:./plugin-backend/application-local.yml"
      - "optional:file:./.env[.properties]"
      - "optional:file:./plugin-backend/.env[.properties]"
  servlet:
    multipart:
      max-file-size: "${MULTIPART_MAX_FILE_SIZE:10MB}"
      max-request-size: "${MULTIPART_MAX_REQUEST_SIZE:50MB}"
  data:
    mongodb:
      uri: "${MONGODB_URI:mongodb://localhost:27017/plugindb}"
      database: "${MONGODB_DATABASE:plugindb}"
      auto-index-creation: false

  mail:
    host: "${MAIL_HOST:smtp.gmail.com}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:plugin.available@gmail.com}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            trust: "${MAIL_HOST:smtp.gmail.com}"

app:
  production: "${APP_PRODUCTION:false}"
  demo-seed:
    enabled: "${DEMO_SEED_ENABLED:false}"
    password: "${DEMO_SEED_PASSWORD:}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}"
  otp:
    pepper: "${OTP_PEPPER}"
    max-attempts: "${OTP_MAX_ATTEMPTS:5}"
    resend-cooldown-seconds: "${OTP_RESEND_COOLDOWN_SECONDS:60}"
  rate-limit:
    enabled: "${RATE_LIMIT_ENABLED:true}"
    key-pepper: "${RATE_LIMIT_PEPPER}"
    trusted-proxies: "${TRUSTED_PROXY_CIDRS:}"
  mail:
    from: "${MAIL_FROM:${MAIL_USERNAME:plugin.available@gmail.com}}"
  confirm:
    base-url: "${APP_BASE_URL:http://localhost:8091}"
  billing:
    default-rate-per-kwh: "${DEFAULT_RATE_PER_KWH:15}"
    efficiency-factor: "${CHARGING_EFFICIENCY_FACTOR:0.92}"
  energy:
    provider: "${GRID_DATA_PROVIDER:india-energy-atlas}"
    default-region: "${GRID_DEFAULT_REGION:IN-WE}"
    cache-seconds: "${GRID_DATA_CACHE_SECONDS:900}"
    history:
      region: "${GRID_HISTORY_REGION:IN-WE}"
      initial-delay-ms: "${GRID_HISTORY_INITIAL_DELAY_MS:120000}"
      capture-delay-ms: "${GRID_HISTORY_CAPTURE_DELAY_MS:3600000}"
    alerts:
      region: "${RENEWABLE_ALERT_REGION:IN-WE}"
      minimum-share-percent: "${RENEWABLE_ALERT_MINIMUM_SHARE:40}"
      initial-delay-ms: "${RENEWABLE_ALERT_INITIAL_DELAY_MS:180000}"
      check-delay-ms: "${RENEWABLE_ALERT_CHECK_DELAY_MS:1800000}"
    pricing:
      renewable-discount-factor: "${RENEWABLE_DISCOUNT_FACTOR:0.30}"
      maximum-renewable-discount-percent: "${MAX_RENEWABLE_DISCOUNT_PERCENT:30}"
      maximum-total-discount-percent: "${MAX_TOTAL_DISCOUNT_PERCENT:40}"
      minimum-rate-per-kwh: "${MINIMUM_DYNAMIC_RATE_PER_KWH:1}"
      low-utilization-threshold-percent: "${LOW_UTILIZATION_THRESHOLD_PERCENT:35}"
      low-utilization-incentive-percent: "${LOW_UTILIZATION_INCENTIVE_PERCENT:3}"
      congestion-threshold-percent: "${GRID_CONGESTION_THRESHOLD_PERCENT:85}"
      congestion-adjustment-percent: "${GRID_CONGESTION_ADJUSTMENT_PERCENT:5}"
    external:
      base-url: "${GRID_DATA_BASE_URL:}"
      api-key: "${GRID_DATA_API_KEY:}"
      connect-timeout-ms: "${GRID_DATA_CONNECT_TIMEOUT_MS:3000}"
      read-timeout-ms: "${GRID_DATA_READ_TIMEOUT_MS:5000}"
  support:
    email: "${SUPPORT_EMAIL:plugin.onservice@gmail.com}"
  website:
    url: "${WEBSITE_URL:www.plugin.com}"
  notifications:
    booking-start-initial-delay-ms: "${BOOKING_START_NOTIFICATION_INITIAL_DELAY_MS:10000}"
    booking-start-check-ms: "${BOOKING_START_NOTIFICATION_CHECK_MS:30000}"
    booking-start-lookback-minutes: "${BOOKING_START_NOTIFICATION_LOOKBACK_MINUTES:180}"
  google:
    client-ids: "${GOOGLE_CLIENT_IDS:}"
    connect-timeout-ms: "${GOOGLE_CONNECT_TIMEOUT_MS:5000}"
    read-timeout-ms: "${GOOGLE_READ_TIMEOUT_MS:5000}"
  razorpay:
    key-id: "${RAZORPAY_KEY_ID:}"
    key-secret: "${RAZORPAY_KEY_SECRET:}"
    currency: "${RAZORPAY_CURRENCY:INR}"
    business-name: "${RAZORPAY_BUSINESS_NAME:PLUGIN}"
    minimum-amount: "${RAZORPAY_MINIMUM_AMOUNT:1.00}"
  wallet:
    monitor-initial-delay-ms: "${WALLET_MONITOR_INITIAL_DELAY_MS:2000}"
    monitor-check-ms: "${WALLET_MONITOR_CHECK_MS:3000}"
  bookings:
    expiry-initial-delay-ms: "${BOOKING_EXPIRY_INITIAL_DELAY_MS:15000}"
    expiry-check-ms: "${BOOKING_EXPIRY_CHECK_MS:30000}"
  sessions:
    auto-complete-initial-delay-ms: "${SESSION_AUTO_COMPLETE_INITIAL_DELAY_MS:1000}"
    auto-complete-check-ms: "${SESSION_AUTO_COMPLETE_CHECK_MS:1000}"
  jwt:
    secret: "${JWT_SECRET}"
    issuer: "${JWT_ISSUER:plugin-api}"
    audience: "${JWT_AUDIENCE:plugin-clients}"
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

logging:
  level:
    com.plugin: INFO
    org.springframework.security: INFO
