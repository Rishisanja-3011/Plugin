apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def envOrProperty = { String name -> System.getenv(name) ?: findProperty(name) }
def releaseStoreFile = envOrProperty('PLUGIN_RELEASE_STORE_FILE')
def releaseStorePassword = envOrProperty('PLUGIN_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = envOrProperty('PLUGIN_RELEASE_KEY_ALIAS')
def releaseKeyPassword = envOrProperty('PLUGIN_RELEASE_KEY_PASSWORD')
def releaseApiBaseUrl = envOrProperty('EXPO_PUBLIC_API_BASE_URL')
def googleMapsApiKey = envOrProperty('EXPO_PUBLIC_GOOGLE_MAPS_API_KEY') ?: ''
def googleClientId = envOrProperty('EXPO_PUBLIC_GOOGLE_CLIENT_ID') ?: ''
def allowDevNetworking = String.valueOf(envOrProperty('EXPO_PUBLIC_ALLOW_DEV_NETWORKING') ?: '').equalsIgnoreCase('true')
def releaseSigningConfigured = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it != null && !String.valueOf(it).trim().isEmpty() }

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
    // The Expo export command otherwise starts one Metro worker per CPU core.
    // Keep local/release APK bundling reliable on memory-constrained developer
    // machines; this only affects build speed, not the generated application.
    extraPackagerArgs = ["--max-workers", "1"]

    // Debug uses Metro and __DEV__ so LAN-only origins and development payment helpers
    // cannot be confused with a production bundle. Release always embeds its JS bundle.
    debuggableVariants = ["debug"]

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

// React Native's bundle task does not automatically fingerprint Expo's public
// environment variables. Track them explicitly so switching between Wi-Fi and
// adb reverse can never reuse a bundle containing the previous API address.
tasks.configureEach { task ->
    if (task.name.startsWith('createBundle') && task.name.endsWith('JsAndAssets')) {
        task.inputs.property('pluginPublicApiBaseUrl', String.valueOf(envOrProperty('EXPO_PUBLIC_API_BASE_URL') ?: ''))
        task.inputs.property('pluginPublicApiLanBaseUrl', String.valueOf(envOrProperty('EXPO_PUBLIC_API_LAN_BASE_URL') ?: ''))
        task.inputs.property('pluginPublicApiPort', String.valueOf(envOrProperty('EXPO_PUBLIC_API_PORT') ?: ''))
        task.inputs.property('pluginAllowDevNetworking', String.valueOf(envOrProperty('EXPO_PUBLIC_ALLOW_DEV_NETWORKING') ?: ''))
    }
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: true).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.0.1'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.plugin.mobile'
    defaultConfig {
        applicationId 'com.plugin.mobile'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: googleMapsApiKey]

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        local {
            initWith debug
            debuggable false
            matchingFallbacks = ['debug']
        }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'true'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

tasks.register('verifyReleaseSecurity') {
    group = 'verification'
    description = 'Fails release builds unless production signing and HTTPS configuration are present.'
    doLast {
        if (allowDevNetworking) {
            throw new GradleException('Release builds cannot enable EXPO_PUBLIC_ALLOW_DEV_NETWORKING.')
        }
        if (!releaseSigningConfigured) {
            throw new GradleException('Release signing is required. Set PLUGIN_RELEASE_STORE_FILE, PLUGIN_RELEASE_STORE_PASSWORD, PLUGIN_RELEASE_KEY_ALIAS, and PLUGIN_RELEASE_KEY_PASSWORD.')
        }

        def configuredStore = file(releaseStoreFile)
        if (!configuredStore.isFile()) {
            throw new GradleException('PLUGIN_RELEASE_STORE_FILE does not point to a readable keystore file.')
        }
        if (configuredStore.canonicalFile == file('debug.keystore').canonicalFile) {
            throw new GradleException('The debug keystore cannot be used to sign a release build.')
        }

        def loadKeyStore = { File store, String password ->
            Exception lastFailure = null
            for (String storeType : ['PKCS12', 'JKS']) {
                try {
                    def keyStore = java.security.KeyStore.getInstance(storeType)
                    store.withInputStream { input -> keyStore.load(input, password.toCharArray()) }
                    return keyStore
                } catch (Exception failure) {
                    lastFailure = failure
                }
            }
            throw new GradleException('Release keystore cannot be opened as PKCS12 or JKS.', lastFailure)
        }

        try {
            def releaseKeyStore = loadKeyStore(configuredStore, String.valueOf(releaseStorePassword))
            if (!releaseKeyStore.isKeyEntry(String.valueOf(releaseKeyAlias))) {
                throw new GradleException('PLUGIN_RELEASE_KEY_ALIAS is not a private-key entry in the release keystore.')
            }
            releaseKeyStore.getKey(String.valueOf(releaseKeyAlias), String.valueOf(releaseKeyPassword).toCharArray())
            def releaseCertificate = releaseKeyStore.getCertificate(String.valueOf(releaseKeyAlias))
            if (!(releaseCertificate instanceof java.security.cert.X509Certificate)) {
                throw new GradleException('The release signing entry must contain an X.509 certificate.')
            }
            releaseCertificate.checkValidity()

            def debugKeyStore = loadKeyStore(file('debug.keystore'), 'android')
            def debugCertificate = debugKeyStore.getCertificate('androiddebugkey')
            if (debugCertificate != null && java.util.Arrays.equals(releaseCertificate.encoded, debugCertificate.encoded)) {
                throw new GradleException('The Android debug certificate cannot sign a release build.')
            }
        } catch (GradleException failure) {
            throw failure
        } catch (Exception failure) {
            throw new GradleException('Release signing alias, private-key password, or certificate validation failed.', failure)
        }

        try {
            def apiUri = new URI(String.valueOf(releaseApiBaseUrl))
            if (apiUri.scheme != 'https' || !apiUri.host || apiUri.userInfo || apiUri.query || apiUri.fragment) {
                throw new IllegalArgumentException('invalid production API URL')
            }
        } catch (Exception ignored) {
            throw new GradleException('EXPO_PUBLIC_API_BASE_URL must be one credential-free HTTPS origin for release builds.')
        }

        if (!String.valueOf(googleMapsApiKey).trim()) {
            throw new GradleException('EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is required for release builds and must be restricted in Google Cloud.')
        }
        if (!String.valueOf(googleClientId).trim()) {
            throw new GradleException('EXPO_PUBLIC_GOOGLE_CLIENT_ID is required for release builds.')
        }
    }
}

afterEvaluate {
    tasks.named('preReleaseBuild').configure {
        dependsOn(tasks.named('verifyReleaseSecurity'))
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
